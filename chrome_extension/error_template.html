<!-- error_template.html -->
<div id="error-container" class="error-box">
  <div class="error-title">We’re just getting started 💡</div>
  <div class="error-text">Our AI credits are temporarily maxed out.<br>
    Please try again in <strong>24 hours</strong>.
  </div>
  <div class="error-subtext">
    Want early access when we scale up? Sign up below 👇
  </div>

  <div class="error-signup">
    <input id="email-input" type="email" placeholder="Enter your email" />
    <button id="notify-btn">Notify</button>
  </div>

  <div id="thanks" class="error-thanks">
    Thanks! You’ll hear from us soon 🌱
  </div>
</div>
